spring.application.name=gateway-services
server.port=8089
spring.profiles.active=dev

spring.cloud.config.discovery.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.gateway.server.webmvc.enabled=true
spring.cloud.config.import-check.enabled=false

spring.cloud.gateway.server.webmvc.routes[0].id=book-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api-book/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/api-book/(?<segment>.*), /${segment}
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=CircuitBreaker=name=bookService,fallbackUri=forward:/api/fallback/book

resilience4j.circuitbreaker.instances.bookService.register-health-indicator=true
resilience4j.circuitbreaker.instances.bookService.sliding-window-size=5
resilience4j.circuitbreaker.instances.bookService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bookService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bookService.event-consumer-buffer-size=10

spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api-orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RewritePath=/api-orders/(?<segment>.*), /${segment}
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=CircuitBreaker=name=orderService,fallbackUri=forward:/api/fallback/order

resilience4j.circuitbreaker.instances.orderService.register-health-indicator=true
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=5
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderService.event-consumer-buffer-size=10