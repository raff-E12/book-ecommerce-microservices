spring.application.name=gateway-services
server.port=8089
spring.profiles.active=dev

spring.cloud.config.discovery.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.gateway.server.webmvc.enabled=true
spring.cloud.config.import-check.enabled=false

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=*

# Rotte del Gateway

# ─── book-service ───────────────────────────────────────────
spring.cloud.gateway.server.webmvc.routes[0].id=book-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api-book/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/api-book/(?<segment>.*), /${segment}

# ─── order-service ──────────────────────────────────────────
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api-orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RewritePath=/api-orders/(?<segment>.*), /${segment}

# ─── book-rating ────────────────────────────────────────────
spring.cloud.gateway.server.webmvc.routes[2].id=book-rating
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api-rating/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RewritePath=/api-rating/(?<segment>.*), /${segment}

# Timeout TCP
spring.cloud.gateway.httpclient.response-timeout=12s

info.app.nome=Gateway-Services
info.app.versione=1.1.3
info.app.descrizione=Servizio di Gestione Geteway