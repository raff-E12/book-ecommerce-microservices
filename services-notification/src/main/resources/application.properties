spring.application.name=services-notification
server.port=8086

eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.config.enabled=false

# Gestione ZipKim
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=*
logging.structured.format.console=ecs
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Comunicazione con Kafka da parte del Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group 
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# spring.kafka.consumer.properties.spring.json.value.default.type=com.notification.services.events.OrderCheck

# Mapping dei Vari Eventi.
spring.kafka.consumer.properties.spring.json.type.mapping=order:com.notification.services.events.OrderCheck,created:com.notification.services.events.OrderCreated,feedback:com.notification.services.events.OrderFeedback

# Serielizzatore di messaggi per i Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer